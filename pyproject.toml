[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cost-optimizer"
version = "0.2.0"
description = "AI-driven FinOps tool that finds underutilized cloud resources"
requires-python = ">=3.10"
dependencies = ["anthropic", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["collector", "analyst", "executor", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
